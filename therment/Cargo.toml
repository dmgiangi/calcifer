[package]
name = "therment"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[package.metadata.calcifer.esp-toolchain]
espup-version = "0.19.0"
xtensa-rust-version = "1.97.0.0"
esp-idf-version = "v5.4.4"
target = "xtensa-esp32-espidf"
ldproxy-version = "0.3.5"
espflash-version = "4.7.0"

[features]
ota = []
# Explicitly guarded, only for exercising rollback with disconnected loads.
ota-test-boot-failure = ["ota"]

[[bin]]
name = "therment"
path = "src/bin/main.rs"
harness = false

[dependencies]
esp-idf-hal = "0.47"
esp-idf-svc = "0.53"
embedded-svc = "0.29"
log = "0.4"
serde_json = "1"
sha2 = "0.11"

[build-dependencies]
embuild = "0.33.5"
toml = "1.2.1"

[profile.dev]
debug = true
opt-level = "z"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
