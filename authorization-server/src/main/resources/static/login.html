<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Sign in · calcifer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="login.css">
</head>
<body>
<main class="login-shell">
  <section class="login-card" aria-labelledby="login-title">
    <div class="wordmark" id="login-title">calcifer</div>

    <a class="google-link" href="oauth2/authorization/google" aria-label="Continue with Google">
      <img src="google-mark.svg" alt="" width="32" height="32" aria-hidden="true">
    </a>

    <div class="divider" role="separator"><span>or</span></div>

    <section id="password-login" class="password-login" hidden aria-labelledby="password-title">
      <h2 id="password-title">Sign in with password</h2>
      <form method="post" action="login" id="password-form">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" type="password" name="password" autocomplete="current-password" required>

        <button class="password-button" type="submit">Sign in</button>
      </form>
      <p id="password-error" class="form-error" role="alert" hidden>
        Password sign-in is temporarily unavailable.
      </p>
    </section>

    <p class="security-note">Access is protected by Calcifer Authorization Server.</p>
  </section>
</main>
<script src="login.js" defer></script>
</body>
</html>
