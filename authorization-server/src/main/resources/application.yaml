server:
  forward-headers-strategy: framework
management:
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED:true}
  opentelemetry:
    resource-attributes:
      "cluster.name": ${AUTH_STATE_ROLE:LOCAL}
      "deployment.environment.name": homelab
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,authorizationState
        liveness:
          include: livenessState,ping
  metrics:
    tags:
      application: authorization-server
spring:
  application:
    name: authorization-server
  config:
    import: optional:file:/etc/calcifer/identity/clients.yaml
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid,profile,email
            redirect-uri: https://auth.calcifer.tech/login/oauth2/code/google
identity:
  issuer: ${AUTH_ISSUER:}
  allowed-google-email: ${AUTH_ALLOWED_GOOGLE_EMAIL:dem.gianluigi@gmail.com}
  canonical-user-id: ${AUTH_CANONICAL_USER_ID:user:admin}
  signing-key-location: ${AUTH_SIGNING_KEY_LOCATION:file:/var/run/secrets/authorization-server/jwt-private-key.pem}
  grafana:
    id: ${GRAFANA_OIDC_CLIENT_ID:grafana}
    secret: ${GRAFANA_OIDC_CLIENT_SECRET:}
    redirect-uri: ${GRAFANA_OIDC_REDIRECT_URI:https://grafana.calcifer.tech/login/generic_oauth}
    audience: ${GRAFANA_OIDC_AUDIENCE:grafana}
  grafana-api:
    id: ${GRAFANA_API_CLIENT_ID:grafana-api}
    secret: ${GRAFANA_API_CLIENT_SECRET:}
    redirect-uri: ${GRAFANA_API_REDIRECT_URI:https://grafana.calcifer.tech}
    audience: ${GRAFANA_API_AUDIENCE:grafana}
  local-login:
    enabled: ${AUTH_LOCAL_LOGIN_ENABLED:false}
    username: ${AUTH_LOCAL_LOGIN_USERNAME:dem.gianluigi@gmail.com}
    password-hash: ${AUTH_LOCAL_LOGIN_PASSWORD_HASH:}
  state:
    enabled: ${AUTH_STATE_ENABLED:false}
    role: ${AUTH_STATE_ROLE:CLOUD}
    redis:
      host: ${AUTH_STATE_REDIS_HOST:localhost}
      port: ${AUTH_STATE_REDIS_PORT:6379}
      username: ${AUTH_STATE_REDIS_USERNAME:}
      password: ${AUTH_STATE_REDIS_PASSWORD:}
      namespace: ${AUTH_STATE_REDIS_NAMESPACE:auth}
    failure-threshold: ${AUTH_STATE_FAILURE_THRESHOLD:3}
    probe-interval: ${AUTH_STATE_PROBE:2s}
    minimum-isolation: ${AUTH_STATE_MINIMUM_ISOLATION:15s}
    stable-success: ${AUTH_STATE_STABLE_SUCCESS:30s}
    lease-ttl: ${AUTH_STATE_LEASE_TTL:30s}
    gate-ttl: ${AUTH_STATE_GATE_TTL:20s}
    drain: ${AUTH_STATE_DRAIN:3s}
    cleanup-batch-size: ${AUTH_STATE_CLEANUP_BATCH_SIZE:100}
    access-token-ttl: ${AUTH_STATE_ACCESS_TOKEN_TTL:5m}
