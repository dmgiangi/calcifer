name: Release authorization server

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable SemVer release version (for example 0.1.0)
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: authorization-server-promotion
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/calcifer-authorization-server
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test -n "$VERSION"
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test and compile native executable
        working-directory: authorization-server
        env:
          # Spring AOT evaluates identity.state.enabled while generating the
          # native bean graph; production overlays enable resilient state.
          AUTH_STATE_ENABLED: 'true'
        run: |
          mvn -B -s .mvn/settings.xml -Pnative native:compile -DskipTests
          mvn -B -s .mvn/settings.xml -PnativeTest \
            '-Dtest=RedisOAuth2AuthorizationStoreTest,AuthorizationStateRoutingTest#authenticatedOidcSessionRoundTripsThroughRedis' \
            test
          mvn -B -s .mvn/settings.xml test
      - name: Validate GitOps overlays
        run: |
          for overlay in \
            clusters/apps/authorization-server/overlays/cloud \
            clusters/apps/authorization-server/overlays/home; do
            test -f "$overlay/image-patch.yaml"
            kubectl kustomize "$overlay" >/dev/null
          done
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: authorization-server
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ inputs.version }}
      - name: Promote immutable digest to Flux
        env:
          VERSION: ${{ inputs.version }}
        run: |
          DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}')"
          printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          promotion_dir="$(mktemp -d)"
          trap 'rm -rf "$promotion_dir"' EXIT
          for file in \
            clusters/apps/authorization-server/overlays/cloud/image-patch.yaml \
            clusters/apps/authorization-server/overlays/home/image-patch.yaml; do
            staged="$promotion_dir/$(basename "$file")"
            cp "$file" "$staged"
            sed -i -E "s|image: ghcr.io/.+|image: ${IMAGE}@${DIGEST}|" "$staged"
            grep -Eq "^[[:space:]]+image: ${IMAGE}@${DIGEST}$" "$staged"
          done
          for file in \
            clusters/apps/authorization-server/overlays/cloud/image-patch.yaml \
            clusters/apps/authorization-server/overlays/home/image-patch.yaml; do
            cp "$promotion_dir/$(basename "$file")" "$file"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            clusters/apps/authorization-server/overlays/cloud/image-patch.yaml \
            clusters/apps/authorization-server/overlays/home/image-patch.yaml
          git commit -m "release(auth): promote authorization server $VERSION"
          git push origin HEAD:master
