name: Release authorization server

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable SemVer release version (for example 0.1.0)
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: authorization-server-promotion
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/calcifer-authorization-server
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Validate version
        run: |
          test "${{ inputs.version }}" != ""
          printf '%s' "${{ inputs.version }}" | grep -Ex '[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?'
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test and compile native executable
        working-directory: authorization-server
        run: mvn -B -s .mvn/settings.xml -Pnative test native:compile
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: authorization-server
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ inputs.version }}
      - name: Promote immutable digest to Flux
        run: |
          DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${{ inputs.version }}" --format '{{.Manifest.Digest}}')"
          test -n "$DIGEST"
          sed -i -E "s|image: ghcr.io/.+|image: ${IMAGE}@${DIGEST}|" apps/authorization-server/overlays/cloud/image-patch.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/authorization-server/overlays/cloud/image-patch.yaml
          git commit -m "release(auth): promote authorization server ${{ inputs.version }}" 
          git push origin HEAD:master
