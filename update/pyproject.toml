[project]
name = "calcifer-update"
version = "0.1.0"
description = "Inspect and prepare Calcifer cluster and dependency updates"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0,<7",
    "packaging>=24,<27",
    "rich>=15.0.0",
]

[project.scripts]
calcifer-update = "update.__main__:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/update"]
