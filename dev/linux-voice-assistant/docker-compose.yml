services:
  fix-permissions:
    image: ghcr.io/ohf-voice/linux-voice-assistant:1.1.15@sha256:5a6ecf5ad5ee871851331c47885b0b0fdf81b2a5e6e33824093b557028d619b6
    entrypoint: []
    command: >-
      chown -R ${LVA_USER_ID:-1000}:${LVA_USER_GROUP:-1000}
      /app/local /app/configuration /app/wakewords/custom /app/sounds/custom
    environment:
      XDG_RUNTIME_DIR: ${LVA_XDG_RUNTIME_DIR:-/run/user/1000}
      PULSE_SERVER: ${LVA_PULSE_SERVER:-/run/user/1000/pulse/native}
      PULSE_COOKIE: ${LVA_PULSE_COOKIE:-/run/user/1000/pulse/cookie}
    group_add:
      - ${LVA_AUDIO_GROUP:-audio}
    volumes:
      - wakeword_data:/app/local
      - wakeword_custom:/app/wakewords/custom
      - configuration:/app/configuration
      - sounds_custom:/app/sounds/custom
    restart: "no"

  linux-voice-assistant:
    container_name: linux-voice-assistant
    image: ghcr.io/ohf-voice/linux-voice-assistant:1.1.15@sha256:5a6ecf5ad5ee871851331c47885b0b0fdf81b2a5e6e33824093b557028d619b6
    restart: unless-stopped
    network_mode: host
    user: "${LVA_USER_ID:-1000}:${LVA_USER_GROUP:-1000}"
    environment:
      XDG_RUNTIME_DIR: ${LVA_XDG_RUNTIME_DIR:-/run/user/1000}
      PULSE_SERVER: ${LVA_PULSE_SERVER:-/run/user/1000/pulse/native}
      PULSE_COOKIE: ${LVA_PULSE_COOKIE:-/run/user/1000/pulse/cookie}
      CLIENT_NAME: ${CLIENT_NAME:-linux-voice-assistant}
      PORT: ${LVA_PORT:-6053}
      WAKE_WORD_DIR: ${WAKE_WORD_DIR:-/app/wakewords/custom}
      WAKE_MODEL: ${WAKE_MODEL:-calcifer}
      AUDIO_INPUT_DEVICE: ${AUDIO_INPUT_DEVICE:-default}
      AUDIO_OUTPUT_DEVICE: ${AUDIO_OUTPUT_DEVICE:-default}
    group_add:
      - ${LVA_AUDIO_GROUP:-audio}
    cap_add:
      - SYS_NICE
    volumes:
      - wakeword_data:/app/local
      - wakeword_custom:/app/wakewords/custom
      - configuration:/app/configuration
      - sounds_custom:/app/sounds/custom
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # LVA creates the PulseAudio cookie here when PipeWire does not provide
      # one. This is the host runtime directory, never repository data.
      - ${LVA_XDG_RUNTIME_DIR:-/run/user/1000}:${LVA_XDG_RUNTIME_DIR:-/run/user/1000}
    depends_on:
      fix-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pgrep", "-f", "linux_voice_assistant"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  wakeword_data:
  wakeword_custom:
  configuration:
  sounds_custom: