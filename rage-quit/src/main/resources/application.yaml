server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: RAGE_QUIT_SESSION
        secure: true
        http-only: true
        same-site: lax
spring:
  application:
    name: rage-quit
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  sql:
    init:
      mode: never
rage-quit:
  issuer: ${RAGE_QUIT_ISSUER:}
  client-id: ${RAGE_QUIT_CLIENT_ID:}
  client-secret: ${RAGE_QUIT_CLIENT_SECRET:}
  database: ${RAGE_QUIT_DATABASE:}
  start-date: ${RAGE_QUIT_START_DATE:}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,storage
        liveness:
          include: livenessState,ping
