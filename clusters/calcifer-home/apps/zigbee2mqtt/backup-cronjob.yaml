apiVersion: batch/v1
kind: CronJob
metadata:
  name: zigbee2mqtt-backup
  namespace: zigbee2mqtt
spec:
  schedule: "0 3 * * *"
  timeZone: Europe/Rome
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: zigbee2mqtt-backup
        spec:
          nodeSelector:
            kubernetes.io/hostname: calcifer-home
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: snapshot-data
              image: ghcr.io/koenkk/zigbee2mqtt:2.14.1
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
                - |
                  mkdir -p /snapshot/data
                  cp -a /source/. /snapshot/data/
                  test -f /snapshot/data/configuration.yaml
                  cd /snapshot
                  find data -type f -exec sha256sum {} \; > SHA256SUMS
                  test -s /snapshot/SHA256SUMS
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - name: data
                  mountPath: /source
                  readOnly: true
                - name: snapshot
                  mountPath: /snapshot
                - name: temporary
                  mountPath: /tmp
          containers:
            - name: restic
              image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
                - |
                  if ! restic cat config >/dev/null 2>&1; then
                    restic init
                  fi
                  restic backup /snapshot/data /snapshot/SHA256SUMS \
                    --host calcifer-home \
                    --tag zigbee2mqtt
                  restic check --read-data-subset=5%
                  restic forget \
                    --host calcifer-home \
                    --path /snapshot/data \
                    --tag zigbee2mqtt \
                    --keep-daily 7 \
                    --prune
              env:
                - name: HTTPS_PROXY
                  value: http://172.31.255.1:3128
                - name: RESTIC_REPOSITORY
                  value: azure:zigbee2mqtt-backups:/restic
                - name: RESTIC_CACHE_DIR
                  value: /cache
                - name: AZURE_ACCOUNT_NAME
                  valueFrom:
                    secretKeyRef:
                      name: zigbee2mqtt-backup
                      key: AZURE_ACCOUNT_NAME
                - name: AZURE_ACCOUNT_SAS
                  valueFrom:
                    secretKeyRef:
                      name: zigbee2mqtt-backup
                      key: AZURE_ACCOUNT_SAS
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: zigbee2mqtt-backup
                      key: RESTIC_PASSWORD
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              volumeMounts:
                - name: snapshot
                  mountPath: /snapshot
                  readOnly: true
                - name: cache
                  mountPath: /cache
                - name: temporary
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: zigbee2mqtt-data
            - name: snapshot
              emptyDir:
                sizeLimit: 4Gi
            - name: cache
              emptyDir:
                sizeLimit: 1Gi
            - name: temporary
              emptyDir:
                sizeLimit: 64Mi