apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: zigbee2mqtt-security-headers
  namespace: zigbee2mqtt
spec:
  headers:
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: no-referrer
    stsSeconds: 31536000
    stsIncludeSubdomains: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: zigbee2mqtt
  namespace: zigbee2mqtt
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`zigbee.calcifer.tech`)
      middlewares:
        - name: zigbee2mqtt-security-headers
      services:
        - name: zigbee2mqtt
          port: 4180
          passHostHeader: true
  tls:
    secretName: zigbee2mqtt-tls
