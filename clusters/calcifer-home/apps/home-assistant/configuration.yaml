default_config:

homeassistant:
  auth_providers:
    - type: homeassistant

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 10.42.0.0/16
    - 192.168.0.102

auth_oidc:
  client_id: home-assistant
  client_secret: !secret oidc_client_secret
  discovery_url: https://auth.calcifer.tech/.well-known/openid-configuration
  display_name: Calcifer Authorization Server
  additional_scopes:
    - email
  features:
    include_groups_scope: false
    force_https: true
  claims:
    display_name: email
    username: email
    groups: roles
  roles:
    admin: admin
