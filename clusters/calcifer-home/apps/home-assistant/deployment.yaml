apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: configure-http
          image: ghcr.io/home-assistant/home-assistant:2026.9.2@sha256:a1bc133af84ee6505fe2c266d9805b7c75b780dfdc188edfee3b11e8f3cd8efe
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -c
            - |
              import json
              import os
              from datetime import datetime, timezone
              from pathlib import Path

              path = Path("/config/.storage/http")
              path.parent.mkdir(parents=True, exist_ok=True)
              created_at = datetime.now(timezone.utc).isoformat()
              if path.exists():
                  current = json.loads(path.read_text())
                  created_at = current.get("data", {}).get("stable", {}).get("created_at", created_at)
              stable = {
                  "server_port": 8123,
                  "use_x_forwarded_for": True,
                  "trusted_proxies": ["10.42.0.0/16", "192.168.0.102/32"],
                  "cors_allowed_origins": ["https://cast.home-assistant.io"],
                  "login_attempts_threshold": -1,
                  "ip_ban_enabled": True,
                  "ssl_profile": "modern",
                  "use_x_frame_options": True,
                  "created_at": created_at,
                  "error": None,
                  "error_message": None,
              }
              payload = {
                  "version": 2,
                  "minor_version": 2,
                  "key": "http",
                  "data": {"stable": stable, "pending": None, "yaml_migration_done": True},
              }
              temporary = path.with_name("http.tmp")
              temporary.write_text(json.dumps(payload, indent=2) + "\n")
              os.chmod(temporary, 0o600)
              os.replace(temporary, path)
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /config
        - name: install-oidc-component
          image: ghcr.io/home-assistant/home-assistant:2026.9.2@sha256:a1bc133af84ee6505fe2c266d9805b7c75b780dfdc188edfee3b11e8f3cd8efe
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -c
            - |
              import hashlib
              from pathlib import Path
              import urllib.request
              import zipfile

              archive = Path("/tmp/hass-oidc-auth.zip")
              url = "https://github.com/christiaangoossens/hass-oidc-auth/releases/download/v1.2.1/hass-oidc-auth.zip"
              with urllib.request.urlopen(url, timeout=60) as response, archive.open("wb") as output:
                  output.write(response.read())
              digest = hashlib.sha256(archive.read_bytes()).hexdigest()
              if digest != "e5badaaacaa63cfd6fe733924a05e76d75058836190398598fb24de57cd47ccd":
                  raise RuntimeError("hass-oidc-auth checksum mismatch")
              with zipfile.ZipFile(archive) as bundle:
                  bundle.extractall("/component")
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: oidc-component
              mountPath: /component
            - name: temporary
              mountPath: /tmp
        - name: install-hacs
          image: ghcr.io/home-assistant/home-assistant:2026.9.2@sha256:a1bc133af84ee6505fe2c266d9805b7c75b780dfdc188edfee3b11e8f3cd8efe
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -c
            - |
              import hashlib
              import os
              import shutil
              from pathlib import Path
              import urllib.request
              import zipfile

              component = Path("/config/custom_components/hacs")
              if (component / "manifest.json").exists():
                  print("HACS is already installed; preserving the existing version")
                  raise SystemExit(0)

              custom_components = component.parent
              staging = custom_components / ".hacs-install"
              archive = Path("/tmp/hacs-2.0.5.zip")
              url = "https://github.com/hacs/integration/releases/download/2.0.5/hacs.zip"
              expected_digest = "97be6b824a4f38e683728cc6dd72367f6b8bad0a43428b1b3b987a3087adf413"

              custom_components.mkdir(parents=True, exist_ok=True)
              if staging.exists():
                  shutil.rmtree(staging)
              if archive.exists():
                  archive.unlink()
              with urllib.request.urlopen(url, timeout=120) as response, archive.open("wb") as output:
                  shutil.copyfileobj(response, output)

              digest = hashlib.sha256(archive.read_bytes()).hexdigest()
              if digest != expected_digest:
                  raise RuntimeError("HACS checksum mismatch")

              staging.mkdir()
              with zipfile.ZipFile(archive) as bundle:
                  bundle.extractall(staging)
              if not (staging / "manifest.json").exists():
                  raise RuntimeError("HACS archive does not contain manifest.json")
              if component.exists():
                  shutil.rmtree(component)
              os.replace(staging, component)
              archive.unlink()
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /config
            - name: temporary
              mountPath: /tmp
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.9.2@sha256:a1bc133af84ee6505fe2c266d9805b7c75b780dfdc188edfee3b11e8f3cd8efe
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: configuration
              mountPath: /config/configuration.yaml
              subPath: configuration.yaml
              readOnly: true
            - name: secrets
              mountPath: /config/secrets.yaml
              subPath: secrets.yaml
              readOnly: true
            - name: oidc-component
              mountPath: /config/custom_components/auth_oidc
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: configuration
          configMap:
            name: home-assistant-configuration
        - name: secrets
          secret:
            secretName: home-assistant-secrets
        - name: oidc-component
          emptyDir:
            sizeLimit: 5Mi
        - name: temporary
          emptyDir:
            sizeLimit: 32Mi
