apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: edge-test-auth
  namespace: edge-test
spec:
  basicAuth:
    secret: edge-test-auth
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: edge-test
  namespace: edge-test
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`edge-test.calcifer.tech`)
      middlewares:
        - name: edge-test-auth
      services:
        - name: whoami
          port: 80
  tls:
    secretName: edge-test-production-tls
