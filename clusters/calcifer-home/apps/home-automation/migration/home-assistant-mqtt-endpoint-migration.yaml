apiVersion: batch/v1
kind: Job
metadata:
  name: home-assistant-mqtt-endpoint-migration-v1
  namespace: home-automation
  labels:
    app.kubernetes.io/name: home-assistant-migration
    app.kubernetes.io/component: mqtt-endpoint
  annotations:
    calcifer.tech/cutover-only: "true"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant-migration
        app.kubernetes.io/component: mqtt-endpoint
    spec:
      nodeSelector:
        kubernetes.io/hostname: calcifer-home
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/home-assistant/home-assistant:2026.9.2@sha256:a1bc133af84ee6505fe2c266d9805b7c75b780dfdc188edfee3b11e8f3cd8efe
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -c
            - |
              import json
              import os
              from pathlib import Path

              path = Path("/config/.storage/core.config_entries")
              old = "mosquitto.mqtt.svc.cluster.local"
              new = "mosquitto.home-automation.svc.cluster.local"
              content = path.read_text()
              json.loads(content)
              old_count = content.count(old)
              new_count = content.count(new)
              if old_count == 0 and new_count == 2:
                  raise SystemExit(0)
              if old_count != 2 or new_count != 0:
                  raise RuntimeError("Unexpected Home Assistant MQTT endpoint count")
              updated = content.replace(old, new)
              json.loads(updated)
              temporary = path.with_name("core.config_entries.migration")
              temporary.write_text(updated)
              os.chmod(temporary, path.stat().st_mode & 0o777)
              os.replace(temporary, path)
              verified = path.read_text()
              if verified.count(old) != 0 or verified.count(new) != 2:
                  raise RuntimeError("Home Assistant MQTT endpoint migration failed")
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
