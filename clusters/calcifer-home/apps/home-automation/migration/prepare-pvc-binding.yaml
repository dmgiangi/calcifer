apiVersion: batch/v1
kind: Job
metadata:
  name: home-automation-prepare-pvc-binding
  namespace: home-automation
  labels:
    app.kubernetes.io/name: home-automation-migration
    app.kubernetes.io/component: prepare
  annotations:
    calcifer.tech/prepare-only: "true"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-automation-migration
        app.kubernetes.io/component: prepare
    spec:
      nodeSelector:
        kubernetes.io/hostname: calcifer-home
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verify-empty-pvcs
          image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              for destination in /home-assistant /mosquitto /zigbee2mqtt; do
                if find "$destination" -mindepth 1 -maxdepth 1 -print -quit | grep -q .; then
                  echo "Replacement PVC is not empty: $destination" >&2
                  exit 1
                fi
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: home-assistant
              mountPath: /home-assistant
            - name: mosquitto
              mountPath: /mosquitto
            - name: zigbee2mqtt
              mountPath: /zigbee2mqtt
      volumes:
        - name: home-assistant
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: mosquitto
          persistentVolumeClaim:
            claimName: mosquitto-data
        - name: zigbee2mqtt
          persistentVolumeClaim:
            claimName: zigbee2mqtt-data
