apiVersion: apps/v1
kind: Deployment
metadata:
  name: zigbee2mqtt
  namespace: home-automation
  labels:
    app.kubernetes.io/name: zigbee2mqtt
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: zigbee2mqtt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zigbee2mqtt
      annotations:
        calcifer.tech/oauth2-secrets-revision: "1"
    spec:
      nodeSelector:
        kubernetes.io/hostname: calcifer-home
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        supplementalGroups:
          - 20
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: initialize-configuration
          image: ghcr.io/koenkk/zigbee2mqtt:2.14.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              if [ ! -f /app/data/configuration.yaml ]; then
                cp /bootstrap/configuration.yaml /app/data/configuration.yaml
              fi
              chmod 0600 /app/data/configuration.yaml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: configuration
              mountPath: /bootstrap
              readOnly: true
            - name: secrets
              mountPath: /app/data/secret.yaml
              subPath: secret.yaml
              readOnly: true
      containers:
        - name: zigbee2mqtt
          image: ghcr.io/koenkk/zigbee2mqtt:2.14.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: frontend
              containerPort: 8080
          env:
            - name: TZ
              value: Europe/Rome
            - name: ZIGBEE2MQTT_CONFIG_FRONTEND_ENABLED
              value: "true"
            - name: ZIGBEE2MQTT_CONFIG_FRONTEND_PORT
              value: "8080"
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: frontend
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: frontend
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: frontend
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: secrets
              mountPath: /app/data/secret.yaml
              subPath: secret.yaml
              readOnly: true
            - name: coordinator
              mountPath: /dev/ttyUSB0
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: oauth2-proxy
              containerPort: 4180
          env:
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_PROVIDER_DISPLAY_NAME
              value: Calcifer Authorization Server
            - name: OAUTH2_PROXY_OIDC_ISSUER_URL
              value: https://auth.calcifer.tech
            - name: OAUTH2_PROXY_CLIENT_ID
              value: zigbee2mqtt
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: zigbee2mqtt-secrets
                  key: OAUTH2_PROXY_CLIENT_SECRET
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: zigbee2mqtt-secrets
                  key: OAUTH2_PROXY_COOKIE_SECRET
            - name: OAUTH2_PROXY_REDIRECT_URL
              value: https://zigbee.calcifer.tech/oauth2/callback
            - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
              value: S256
            - name: OAUTH2_PROXY_SCOPE
              value: openid profile email
            - name: OAUTH2_PROXY_OIDC_GROUPS_CLAIM
              value: roles
            - name: OAUTH2_PROXY_ALLOWED_GROUPS
              value: admin
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: 0.0.0.0:4180
            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://127.0.0.1:8080/
            - name: OAUTH2_PROXY_REVERSE_PROXY
              value: "true"
            - name: OAUTH2_PROXY_TRUSTED_PROXY_IPS
              value: 10.42.0.0/24
            - name: OAUTH2_PROXY_WHITELIST_DOMAINS
              value: zigbee.calcifer.tech
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
            - name: OAUTH2_PROXY_PROXY_WEBSOCKETS
              value: "true"
            - name: OAUTH2_PROXY_COOKIE_NAME
              value: __Host-zigbee2mqtt_session
            - name: OAUTH2_PROXY_COOKIE_SECURE
              value: "true"
            - name: OAUTH2_PROXY_COOKIE_HTTPONLY
              value: "true"
            - name: OAUTH2_PROXY_COOKIE_SAMESITE
              value: lax
            - name: OAUTH2_PROXY_COOKIE_EXPIRE
              value: 8h
            - name: OAUTH2_PROXY_SESSION_COOKIE_MINIMAL
              value: "true"
            - name: OAUTH2_PROXY_PASS_BASIC_AUTH
              value: "false"
            - name: OAUTH2_PROXY_PASS_USER_HEADERS
              value: "false"
            - name: OAUTH2_PROXY_PASS_ACCESS_TOKEN
              value: "false"
            - name: OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER
              value: "false"
            - name: OAUTH2_PROXY_AUTH_LOGGING
              value: "false"
            - name: OAUTH2_PROXY_REQUEST_LOGGING
              value: "false"
            - name: OAUTH2_PROXY_SILENCE_PING_LOGGING
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /ping
              port: oauth2-proxy
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: oauth2-proxy
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: oauth2-proxy
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zigbee2mqtt-data
        - name: configuration
          configMap:
            name: zigbee2mqtt-configuration
        - name: secrets
          secret:
            secretName: zigbee2mqtt-secrets
            defaultMode: 0600
        - name: coordinator
          hostPath:
            path: /dev/serial/by-id/usb-SONOFF_SONOFF_Dongle_Plus_CC2674P10_26319a63aafef01185fcea1f364a576b-if00-port0
            type: CharDevice
