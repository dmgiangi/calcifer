apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hawkbit
  namespace: home-automation
spec:
  secretName: hawkbit-tls
  dnsNames:
    - ota.calcifer.tech
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-production-azure
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hawkbit-lan-only
  namespace: home-automation
spec:
  ipAllowList:
    sourceRange:
      - 192.168.0.0/24
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hawkbit
  namespace: home-automation
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`ota.calcifer.tech`)
      middlewares:
        - name: hawkbit-lan-only
      services:
        - name: hawkbit
          port: 8080
          passHostHeader: true
  tls:
    secretName: hawkbit-tls
