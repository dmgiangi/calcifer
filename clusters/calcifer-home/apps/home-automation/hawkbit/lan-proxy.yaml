apiVersion: v1
kind: ConfigMap
metadata:
  name: hawkbit-lan-proxy
  namespace: home-automation
data:
  haproxy.cfg: |
    global
      log stdout format raw local0
      nbthread 1
      maxconn 256
    defaults
      mode tcp
      timeout connect 5s
      timeout client 5m
      timeout server 5m
    resolvers kubernetes
      parse-resolv-conf
      accepted_payload_size 8192
      hold valid 10s
    frontend https_lan
      bind 192.168.0.102:8443 ssl crt /tls/server.pem
      tcp-request connection reject if !{ src 192.168.0.0/24 }
      default_backend hawkbit
    backend hawkbit
      server app hawkbit.home-automation.svc.cluster.local:8080 resolvers kubernetes init-addr libc,none check
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hawkbit-lan-proxy
  namespace: home-automation
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hawkbit-lan-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hawkbit-lan-proxy
    spec:
      nodeSelector:
        kubernetes.io/hostname: calcifer-home
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 99
        runAsGroup: 99
        fsGroup: 99
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: haproxy:3.2-alpine
          args: ["-W", "-db", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
          ports:
            - name: https-lan
              containerPort: 8443
              hostPort: 8443
              hostIP: 192.168.0.102
          readinessProbe:
            tcpSocket:
              port: 8443
              host: 192.168.0.102
          livenessProbe:
            tcpSocket:
              port: 8443
              host: 192.168.0.102
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy/haproxy.cfg
              subPath: haproxy.cfg
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: hawkbit-lan-proxy
        - name: tls
          secret:
            secretName: hawkbit-tls
            defaultMode: 288
            items:
              - key: tls.crt
                path: server.pem
              - key: tls.key
                path: server.pem.key
