apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: home-automation
data:
  mosquitto.conf: |
    persistence true
    persistence_location /mosquitto/data/
    autosave_interval 1800
    autosave_on_changes true
    log_dest stdout
    log_type all

    allow_anonymous false
    password_file /mosquitto/password/passwordfile

    listener 1883
    protocol mqtt
