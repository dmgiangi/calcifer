apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: home-assistant
  namespace: home-automation
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`home.calcifer.tech`)
      services:
        - name: home-assistant
          port: 8123
          passHostHeader: true
  tls:
    secretName: home-assistant-tls
