apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  interval: 30m
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: kube-state-metrics
      version: 8.2.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  values:
    fullnameOverride: kube-state-metrics
    replicas: 1
    prometheusScrape: true
    service:
      type: ClusterIP
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 150m
        memory: 192Mi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-node-exporter
  namespace: monitoring
spec:
  interval: 30m
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: prometheus-node-exporter
      version: 4.56.3
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  values:
    fullnameOverride: node-exporter
    prometheus:
      monitor:
        enabled: false
    service:
      type: ClusterIP
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "9100"
        prometheus.io/scrape: "true"
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  interval: 30m
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: alloy
      version: 1.12.1
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
  values:
    crds:
      create: true
    controller:
      type: statefulset
      replicas: 1
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      podDisruptionBudget:
        enabled: false
      volumeClaimTemplates:
        - metadata:
            name: alloy-data
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: local-path
            resources:
              requests:
                storage: 16Gi
    service:
      type: ClusterIP
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "12345"
    alloy:
      enableReporting: false
      stabilityLevel: experimental
      storagePath: /var/lib/alloy
      extraPorts:
        - name: otlp-http
          port: 4318
          targetPort: 4318
          protocol: TCP
      hostAliases:
        - ip: 172.31.255.1
          hostnames:
            - metrics-ingest.calcifer.tech
            - logs-ingest.calcifer.tech
            - traces-ingest.calcifer.tech
      extraEnv:
        - name: METRICS_INGEST_USERNAME
          valueFrom:
            secretKeyRef:
              name: home-ingest-credentials
              key: METRICS_INGEST_USERNAME
        - name: METRICS_INGEST_PASSWORD
          valueFrom:
            secretKeyRef:
              name: home-ingest-credentials
              key: METRICS_INGEST_PASSWORD
        - name: LOGS_INGEST_USERNAME
          valueFrom:
            secretKeyRef:
              name: home-ingest-credentials
              key: LOGS_INGEST_USERNAME
        - name: LOGS_INGEST_PASSWORD
          valueFrom:
            secretKeyRef:
              name: home-ingest-credentials
              key: LOGS_INGEST_PASSWORD
        - name: TRACES_INGEST_USERNAME
          valueFrom:
            secretKeyRef:
              name: home-ingest-credentials
              key: TRACES_INGEST_USERNAME
        - name: TRACES_INGEST_PASSWORD
          valueFrom:
            secretKeyRef:
              name: home-ingest-credentials
              key: TRACES_INGEST_PASSWORD
      mounts:
        extra:
          - name: alloy-data
            mountPath: /var/lib/alloy
      configMap:
        content: |-
          logging {
            level  = "info"
            format = "logfmt"
          }

          otelcol.receiver.otlp "authorization_server" {
            http {
              endpoint = "0.0.0.0:4318"
            }
            output {
              traces = [otelcol.processor.batch.authorization_server.input]
            }
          }

          otelcol.processor.batch "authorization_server" {
            timeout         = "1s"
            send_batch_size = 128
            output {
              traces = [otelcol.exporter.otlphttp.traces.input]
            }
          }

          otelcol.auth.basic "traces" {
            // Alloy v1.19.2 accepts client_auth during validation but cannot
            // build it at runtime; use the compatible form until it is upgraded.
            username = sys.env("TRACES_INGEST_USERNAME")
            password = sys.env("TRACES_INGEST_PASSWORD")
          }

          otelcol.exporter.otlphttp "traces" {
            client {
              endpoint = "https://traces-ingest.calcifer.tech:32443"
              auth     = otelcol.auth.basic.traces.handler
              tls {
                server_name = "traces-ingest.calcifer.tech"
              }
            }
          }

          discovery.kubernetes "pods" {
            role = "pod"
          }

          discovery.relabel "pod_metrics" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
              regex         = "true"
              action         = "keep"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
              target_label  = "__metrics_path__"
              regex         = "(.+)"
              action         = "replace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_port", "__meta_kubernetes_pod_ip"]
              regex         = "([0-9]+);(.+)"
              replacement   = "$2:$1"
              target_label  = "__address__"
              action        = "replace"
            }
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
              action         = "replace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
              action         = "replace"
            }
          }

          prometheus.scrape "pod_metrics" {
            targets    = discovery.relabel.pod_metrics.output
            forward_to = [prometheus.remote_write.victoriametrics.receiver]
          }

          discovery.kubernetes "services" {
            role = "service"
          }

          discovery.relabel "service_metrics" {
            targets = discovery.kubernetes.services.targets

            rule {
              source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_scrape"]
              regex         = "true"
              action         = "keep"
            }
            rule {
              source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_path"]
              target_label  = "__metrics_path__"
              regex         = "(.+)"
              action         = "replace"
            }
            rule {
              source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_port"]
              target_label  = "__meta_kubernetes_service_port_number"
              regex         = "(.+)"
              action         = "replace"
            }
            rule {
              source_labels = ["__meta_kubernetes_service_name", "__meta_kubernetes_namespace", "__meta_kubernetes_service_port_number"]
              regex         = "(.+);(.+);(.+)"
              replacement   = "$1.$2.svc.cluster.local:$3"
              target_label  = "__address__"
              action        = "replace"
            }
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
              action         = "replace"
            }
            rule {
              source_labels = ["__meta_kubernetes_service_name"]
              target_label  = "service"
              action         = "replace"
            }
          }

          prometheus.scrape "service_metrics" {
            targets    = discovery.relabel.service_metrics.output
            forward_to = [prometheus.remote_write.victoriametrics.receiver]
          }

          discovery.kubernetes "nodes" {
            role = "node"
          }

          discovery.relabel "kubelet" {
            targets = discovery.kubernetes.nodes.targets

            rule {
              source_labels = ["__meta_kubernetes_node_name"]
              target_label  = "node"
              action         = "replace"
            }
            rule {
              target_label = "__address__"
              replacement  = "kubernetes.default.svc.cluster.local:443"
              action        = "replace"
            }
            rule {
              source_labels = ["__meta_kubernetes_node_name"]
              regex         = "(.+)"
              replacement   = "/api/v1/nodes/$1/proxy/metrics"
              target_label  = "__metrics_path__"
              action         = "replace"
            }
          }

          prometheus.scrape "kubelet" {
            targets           = discovery.relabel.kubelet.output
            scheme             = "https"
            bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
            tls_config {
              insecure_skip_verify = true
            }
            forward_to = [prometheus.remote_write.victoriametrics.receiver]
          }

          discovery.relabel "cadvisor" {
            targets = discovery.kubernetes.nodes.targets

            rule {
              source_labels = ["__meta_kubernetes_node_name"]
              target_label  = "node"
              action         = "replace"
            }
            rule {
              target_label = "__address__"
              replacement  = "kubernetes.default.svc.cluster.local:443"
              action        = "replace"
            }
            rule {
              source_labels = ["__meta_kubernetes_node_name"]
              regex         = "(.+)"
              replacement   = "/api/v1/nodes/$1/proxy/metrics/cadvisor"
              target_label  = "__metrics_path__"
              action        = "replace"
            }
          }

          prometheus.scrape "cadvisor" {
            targets           = discovery.relabel.cadvisor.output
            scheme             = "https"
            bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
            tls_config {
              insecure_skip_verify = true
            }
            forward_to = [prometheus.remote_write.victoriametrics.receiver]
          }

          prometheus.exporter.blackbox "host_network" {
            config = `
          modules:
            dns_udp:
              prober: dns
              timeout: 5s
              dns:
                transport_protocol: udp
                preferred_ip_protocol: ip4
                query_name: github.com
                query_type: A
                valid_rcodes: [NOERROR]
            dns_tcp:
              prober: dns
              timeout: 5s
              dns:
                transport_protocol: tcp
                preferred_ip_protocol: ip4
                query_name: github.com
                query_type: A
                valid_rcodes: [NOERROR]
            tcp_connect:
              prober: tcp
              timeout: 5s
            http_2xx:
              prober: http
              timeout: 8s
              http:
                preferred_ip_protocol: ip4
                follow_redirects: true
          `

            target {
              name = "host-router-dns-udp"
              address = "192.168.0.1:53"
              module = "dns_udp"
              labels = { probe_name = "host-router-dns-udp", origin = "host", endpoint = "router-dns", protocol = "udp" }
            }
            target {
              name = "host-router-dns-tcp"
              address = "192.168.0.1:53"
              module = "dns_tcp"
              labels = { probe_name = "host-router-dns-tcp", origin = "host", endpoint = "router-dns", protocol = "tcp" }
            }
            target {
              name = "host-cloudflare-dns-udp"
              address = "1.1.1.1:53"
              module = "dns_udp"
              labels = { probe_name = "host-cloudflare-dns-udp", origin = "host", endpoint = "cloudflare-dns", protocol = "udp" }
            }
            target {
              name = "host-cloudflare-dns-tcp"
              address = "1.1.1.1:53"
              module = "dns_tcp"
              labels = { probe_name = "host-cloudflare-dns-tcp", origin = "host", endpoint = "cloudflare-dns", protocol = "tcp" }
            }
            target {
              name = "host-cloudflare-https-tcp"
              address = "1.1.1.1:443"
              module = "tcp_connect"
              labels = { probe_name = "host-cloudflare-https-tcp", origin = "host", endpoint = "cloudflare-https", protocol = "tcp" }
            }
            target {
              name = "host-github-https"
              address = "https://github.com"
              module = "http_2xx"
              labels = { probe_name = "host-github-https", origin = "host", endpoint = "github", protocol = "https" }
            }
            target {
              name = "host-private-ingest-tcp"
              address = "172.31.255.1:32443"
              module = "tcp_connect"
              labels = { probe_name = "host-private-ingest-tcp", origin = "host", endpoint = "private-ingest", protocol = "tcp" }
            }
          }

          discovery.relabel "host_network_probes" {
            targets = prometheus.exporter.blackbox.host_network.targets
            rule {
              source_labels = ["probe_name"]
              target_label  = "instance"
            }
            rule {
              source_labels = ["probe_name"]
              target_label  = "target"
            }
          }

          prometheus.scrape "host_network_probes" {
            targets         = discovery.relabel.host_network_probes.output
            scrape_interval = "15s"
            scrape_timeout  = "10s"
            forward_to      = [prometheus.remote_write.victoriametrics.receiver]
          }

          loki.process "pod_logs" {
            stage.labels {
              values = {
                cluster   = "cluster",
                namespace = "namespace",
                pod       = "pod",
                container = "container",
              }
            }
            forward_to = [loki.write.victorialogs.receiver]
          }

          discovery.relabel "pod_logs" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
              action        = "replace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
              action        = "replace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
              action        = "replace"
            }
          }

          loki.source.kubernetes "pod_logs" {
            targets    = discovery.relabel.pod_logs.output
            forward_to = [loki.process.pod_logs.receiver]
          }

          prometheus.remote_write "victoriametrics" {
            external_labels = {
              cluster = "calcifer-home",
            }
            endpoint {
              url = "https://metrics-ingest.calcifer.tech:32443/api/v1/write"
              basic_auth {
                username = sys.env("METRICS_INGEST_USERNAME")
                password = sys.env("METRICS_INGEST_PASSWORD")
              }
              tls_config {
                server_name = "metrics-ingest.calcifer.tech"
              }
              queue_config {
                max_backoff = "5m"
                sample_age_limit = "48h"
              }
            }
            wal {
              min_keepalive_time = "2h"
              max_keepalive_time = "48h"
            }
          }

          loki.write "victorialogs" {
            external_labels = {
              cluster = "calcifer-home",
            }
            endpoint {
              url = "https://logs-ingest.calcifer.tech:32443/api/v1/push"
              basic_auth {
                username = sys.env("LOGS_INGEST_USERNAME")
                password = sys.env("LOGS_INGEST_PASSWORD")
              }
              tls_config {
                server_name = "logs-ingest.calcifer.tech"
              }
              queue_config {
                capacity = "32MiB"
                block_on_overflow = true
              }
            }
              wal {
                enabled = true
                max_segment_age = "1h"
              }
          }
      resources:
        requests:
          cpu: 75m
          memory: 192Mi
        limits:
          cpu: 400m
          memory: 512Mi
    rbac:
      create: true
      clusterRules:
        - apiGroups:
            - ""
          resources:
            - nodes
          verbs:
            - get
            - list
            - watch
        - apiGroups:
            - ""
          resources:
            - nodes/proxy
          verbs:
            - get
