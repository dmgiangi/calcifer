apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: home-edge-wireguard
  namespace: private-transit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: home-edge-wireguard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-edge-wireguard
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      containers:
        - name: wireguard
          image: ghcr.io/k8s-at-home/wireguard@sha256:4dd54954cbd06d92d8c8fc6b10871eb07a0c1869edfe7a15029f1a7d3178d432
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              private_key="$(tr -d '\n' </secrets/private-key)"
              mkdir -p /run/wireguard
              awk -v key="$private_key" '{ gsub("__PRIVATE_KEY__", key); print }' /config/wg0.conf.template >/run/wireguard/wg0.conf
              chmod 600 /run/wireguard/wg0.conf
              cleanup() { wg-quick down /run/wireguard/wg0.conf || true; }
              trap cleanup EXIT INT TERM
              wg-quick up /run/wireguard/wg0.conf
              while true; do sleep 3600 & wait "$!"; done
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_ADMIN
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: private-key
              mountPath: /secrets
              readOnly: true
            - name: tun
              mountPath: /dev/net/tun
            - name: modules
              mountPath: /lib/modules
              readOnly: true
            - name: run
              mountPath: /run
      volumes:
        - name: config
          configMap:
            name: home-edge-wireguard-config
        - name: private-key
          secret:
            secretName: home-edge-wireguard
            defaultMode: 0400
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: modules
          hostPath:
            path: /lib/modules
            type: Directory
        - name: run
          emptyDir:
            medium: Memory
