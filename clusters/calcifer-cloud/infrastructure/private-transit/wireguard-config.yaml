apiVersion: v1
kind: ConfigMap
metadata:
  name: home-edge-wireguard-config
  namespace: private-transit
data:
  wg0.conf.template: |
    [Interface]
    Address = 172.31.255.1/30
    ListenPort = 51820
    PrivateKey = __PRIVATE_KEY__
    Table = off
    PostUp = ip route replace 172.31.255.2/32 dev %i
    PostUp = iptables -C INPUT -p udp --dport 51820 -j ACCEPT || iptables -I INPUT -p udp --dport 51820 -j ACCEPT
    PostUp = iptables -t mangle -N CALCIFER_PRIVATE_INGEST || true
    PostUp = iptables -t mangle -F CALCIFER_PRIVATE_INGEST
    PostUp = iptables -t mangle -A CALCIFER_PRIVATE_INGEST -i %i -p tcp --dport 32443 -j ACCEPT
    PostUp = iptables -t mangle -A CALCIFER_PRIVATE_INGEST -p tcp --dport 32443 -j DROP
    PostUp = iptables -t mangle -C PREROUTING -j CALCIFER_PRIVATE_INGEST || iptables -t mangle -I PREROUTING -j CALCIFER_PRIVATE_INGEST
    PostDown = iptables -D INPUT -p udp --dport 51820 -j ACCEPT || true
    PostDown = iptables -t mangle -D PREROUTING -j CALCIFER_PRIVATE_INGEST || true
    PostDown = iptables -t mangle -F CALCIFER_PRIVATE_INGEST || true
    PostDown = iptables -t mangle -X CALCIFER_PRIVATE_INGEST || true
    PostDown = ip route del 172.31.255.2/32 dev %i || true

    [Peer]
    PublicKey = W0zQ1stn3UsbNKPhRLD/2bMrpb31snwuIr/lUJPMG3E=
    AllowedIPs = 172.31.255.2/32
