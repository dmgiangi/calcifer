apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: home-edge-wireguard
  namespace: private-transit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: home-edge-wireguard
  template:
    metadata:
      annotations:
        checksum/wireguard-config: private-ingest-nodeport-redis-v2
      labels:
        app.kubernetes.io/name: home-edge-wireguard
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      containers:
        - name: wireguard
          image: ghcr.io/k8s-at-home/wireguard@sha256:4dd54954cbd06d92d8c8fc6b10871eb07a0c1869edfe7a15029f1a7d3178d432
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              private_key="$(tr -d '\n' </secrets/private-key)"
              redis_endpoint_name="authorization-state-redis-endpoint.authorization.svc.cluster.local"
              mkdir -p /run/wireguard
              awk -v key="$private_key" '{ gsub("__PRIVATE_KEY__", key); print }' /config/wg0.conf.template >/run/wireguard/wg0.conf
              chmod 600 /run/wireguard/wg0.conf
              cleanup() {
                iptables -t nat -D PREROUTING -j CALCIFER_AUTH_STATE_REDIS || true
                iptables -t nat -F CALCIFER_AUTH_STATE_REDIS || true
                iptables -t nat -X CALCIFER_AUTH_STATE_REDIS || true
                iptables -D FORWARD -i wg0 -s 172.31.255.2/32 -p tcp --dport 6379 -j ACCEPT || true
                iptables -D FORWARD -o wg0 -d 172.31.255.2/32 -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT || true
                wg-quick down /run/wireguard/wg0.conf || true
              }
              trap cleanup EXIT INT TERM
              wg-quick up /run/wireguard/wg0.conf
              iptables -t nat -N CALCIFER_AUTH_STATE_REDIS || true
              iptables -t nat -F CALCIFER_AUTH_STATE_REDIS
              iptables -t nat -C PREROUTING -j CALCIFER_AUTH_STATE_REDIS || iptables -t nat -I PREROUTING -j CALCIFER_AUTH_STATE_REDIS
              iptables -C FORWARD -i wg0 -s 172.31.255.2/32 -p tcp --dport 6379 -j ACCEPT || iptables -I FORWARD -i wg0 -s 172.31.255.2/32 -p tcp --dport 6379 -j ACCEPT
              iptables -C FORWARD -o wg0 -d 172.31.255.2/32 -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT || iptables -I FORWARD -o wg0 -d 172.31.255.2/32 -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
              while true; do
                redis_endpoint_ip="$(getent ahostsv4 "$redis_endpoint_name" | awk 'NR == 1 {print $1}')"
                iptables -t nat -F CALCIFER_AUTH_STATE_REDIS
                if test -n "$redis_endpoint_ip"; then
                  iptables -t nat -A CALCIFER_AUTH_STATE_REDIS -i wg0 -s 172.31.255.2/32 -p tcp --dport 16379 -j DNAT --to-destination "$redis_endpoint_ip:6379"
                  echo "redis endpoint status=resolved"
                else
                  echo "redis endpoint status=unresolved"
                fi
                sleep 5
              done
          securityContext:
            privileged: true
            runAsUser: 0
            capabilities:
              add:
                - NET_ADMIN
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: private-key
              mountPath: /secrets
              readOnly: true
            - name: tun
              mountPath: /dev/net/tun
            - name: modules
              mountPath: /lib/modules
              readOnly: true
            - name: run
              mountPath: /run
      volumes:
        - name: config
          configMap:
            name: home-edge-wireguard-config
        - name: private-key
          secret:
            secretName: home-edge-wireguard
            defaultMode: 0400
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: modules
          hostPath:
            path: /lib/modules
            type: Directory
        - name: run
          emptyDir:
            medium: Memory
