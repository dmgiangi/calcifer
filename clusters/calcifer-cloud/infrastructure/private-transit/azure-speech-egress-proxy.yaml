apiVersion: v1
kind: ConfigMap
metadata:
  name: azure-speech-egress-proxy-config
  namespace: private-transit
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: azure_speech_egress
          address:
            socket_address:
              address: 172.31.255.1
              port_value: 3129
          filter_chains:
            - filters:
                - name: envoy.filters.network.rbac
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.rbac.v3.RBAC
                    stat_prefix: azure_speech_source
                    rules:
                      action: ALLOW
                      policies:
                        calcifer-home-only:
                          permissions:
                            - any: true
                          principals:
                            - direct_remote_ip:
                                address_prefix: 172.31.255.2
                                prefix_len: 32
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: azure_speech_egress
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                          log_format:
                            text_format_source:
                              inline_string: "azure-speech authority=%REQ(:AUTHORITY)% response=%RESPONSE_CODE%\n"
                    route_config:
                      name: azure_speech_egress
                      virtual_hosts:
                        - name: azure_speech
                          domains:
                            - speech-calcifer-home-itn.cognitiveservices.azure.com:443
                          routes:
                            - match:
                                connect_matcher: {}
                              route:
                                cluster: dynamic_forward_proxy
                                upgrade_configs:
                                  - upgrade_type: CONNECT
                                    connect_config: {}
                    http_filters:
                      - name: envoy.filters.http.dynamic_forward_proxy
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
                          dns_cache_config:
                            name: azure_speech_dns
                            dns_lookup_family: V4_ONLY
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: dynamic_forward_proxy
          lb_policy: CLUSTER_PROVIDED
          cluster_type:
            name: envoy.clusters.dynamic_forward_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
              dns_cache_config:
                name: azure_speech_dns
                dns_lookup_family: V4_ONLY
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-speech-egress-proxy
  namespace: private-transit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: azure-speech-egress-proxy
  template:
    metadata:
      annotations:
        checksum/envoy-config: azure-speech-egress-v2
      labels:
        app.kubernetes.io/name: azure-speech-egress-proxy
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: envoy
          image: envoyproxy/envoy:distroless-v1.33.0@sha256:69c16906fa649d83df125050b33109a6699c085be032fcd30f5f68b98cbe7670
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - /etc/envoy/envoy.yaml
            - --base-id
            - "1"
          ports:
            - name: proxy
              containerPort: 3129
              protocol: TCP
          readinessProbe:
            tcpSocket:
              host: 172.31.255.1
              port: proxy
            initialDelaySeconds: 2
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: azure-speech-egress-proxy-config
        - name: temporary
          emptyDir:
            sizeLimit: 16Mi
