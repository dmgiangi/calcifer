apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-grafana
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/calcifer-cloud/apps/observability/grafana
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: cloud-apps
    - name: authorization-state
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: grafana-operator
      namespace: monitoring
