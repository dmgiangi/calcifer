apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rage-quit
  namespace: flux-system
spec:
  # Operator-authorized testing rollout on 2026-10-05 after symmetric auth,
  # DNS, encrypted secret, immutable app image and start-date checks passed.
  suspend: false
  interval: 10m
  path: ./clusters/apps/rage-quit/overlays/cloud
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: authorization-server
    - name: cert-manager-config
    - name: cloud-apps
