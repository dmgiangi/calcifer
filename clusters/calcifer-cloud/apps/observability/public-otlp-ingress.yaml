# STAGED ONLY: deliberately NOT included by kustomization.yaml.
# Enable only after hostname approval, agreed capacity settings and acceptance.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: public-otlp
  namespace: monitoring
spec:
  secretName: public-otlp-tls
  dnsNames:
    - otlp.calcifer.tech
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-production-azure
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: public-otlp
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`otlp.calcifer.tech`) && Method(`POST`) && (Path(`/v1/traces`) || Path(`/v1/logs`) || Path(`/v1/metrics`))
      kind: Rule
      services:
        - name: otlp-vmauth
          port: 8427
  tls:
    secretName: public-otlp-tls