apiVersion: v1
kind: ConfigMap
metadata:
  name: authorization-server-outcomes-dashboard
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: grafana-operator
data:
  json: |
    {
      "uid": "authorization-server-outcomes",
      "title": "Authorization Server Outcomes",
      "tags": ["authorization", "identity"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "time": {"from": "now-6h", "to": "now"},
      "templating": {"list": [{"name": "cluster", "label": "Cluster", "type": "query", "datasource": {"type": "prometheus", "uid": "victoriametrics"}, "query": "label_values(up{namespace=\"authorization\"}, cluster)", "includeAll": true, "multi": true, "current": {"text": "All", "value": ["$__all"]}}]},
      "panels": [
        {"id": 1, "type": "timeseries", "title": "Authentication successes", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}, "datasource": {"type": "victoriametrics-logs-datasource", "uid": "victoria-logs"}, "targets": [{"refId": "A", "expr": "namespace:authorization \"authentication_success\""}]},
        {"id": 2, "type": "timeseries", "title": "Authentication failures", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}, "datasource": {"type": "victoriametrics-logs-datasource", "uid": "victoria-logs"}, "targets": [{"refId": "A", "expr": "namespace:authorization \"authentication_failure\""}]},
        {"id": 3, "type": "timeseries", "title": "ForwardAuth decisions", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}, "datasource": {"type": "victoriametrics-logs-datasource", "uid": "victoria-logs"}, "targets": [{"refId": "A", "expr": "namespace:authorization \"forward_auth_outcome\""}]},
        {"id": 4, "type": "timeseries", "title": "HTTP 5xx rate", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}, "datasource": {"type": "prometheus", "uid": "victoriametrics"}, "targets": [{"refId": "A", "expr": "sum(rate(http_server_requests_seconds_count{cluster=~\"$cluster\",namespace=\"authorization\",status=~\"5..\"}[5m])) by (cluster)"}]}
      ]
    }
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: authorization-server-outcomes
  namespace: monitoring
spec:
  resyncPeriod: 5m
  folderRef: observability
  instanceSelector:
    matchLabels:
      dashboards: grafana
  configMapRef:
    name: authorization-server-outcomes-dashboard
    key: json
