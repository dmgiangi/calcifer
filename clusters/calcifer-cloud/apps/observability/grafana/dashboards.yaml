apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-dashboard
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: grafana-operator
data:
  json: |
    {
      "uid": "calcifer-observability",
      "title": "Calcifer Cloud Observability",
      "tags": ["calcifer-cloud", "observability"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "templating": {"list": [{"name": "namespace", "label": "Namespace", "type": "query", "datasource": {"type": "prometheus", "uid": "thanos"}, "query": "label_values(kube_namespace_created, namespace)", "includeAll": true, "multi": true, "current": {"text": "All", "value": ["$__all"]}}]},
      "panels": [
        {"id": 1, "type": "timeseries", "title": "Cluster target health", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}, "datasource": {"type": "prometheus", "uid": "thanos"}, "targets": [{"refId": "A", "expr": "sum by (job) (up{cluster=\"calcifer-cloud\"})", "legendFormat": "{{job}}"}], "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "options": {"legend": {"displayMode": "list"}, "tooltip": {"mode": "multi"}}},
        {"id": 2, "type": "timeseries", "title": "Node CPU usage", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}, "datasource": {"type": "prometheus", "uid": "thanos"}, "targets": [{"refId": "A", "expr": "100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{cluster=\"calcifer-cloud\", mode=\"idle\"}[5m])))", "legendFormat": "{{instance}}"}], "fieldConfig": {"defaults": {"unit": "percent"}, "overrides": []}, "options": {"legend": {"displayMode": "list"}, "tooltip": {"mode": "multi"}}},
        {"id": 3, "type": "timeseries", "title": "Container memory", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}, "datasource": {"type": "prometheus", "uid": "thanos"}, "targets": [{"refId": "A", "expr": "sum by (namespace) (container_memory_working_set_bytes{cluster=\"calcifer-cloud\", namespace=~\"$namespace\", container!=\"\"})", "legendFormat": "{{namespace}}"}], "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}, "options": {"legend": {"displayMode": "list"}, "tooltip": {"mode": "multi"}}},
        {"id": 4, "type": "stat", "title": "Observability components up", "gridPos": {"h": 5, "w": 6, "x": 12, "y": 8}, "datasource": {"type": "prometheus", "uid": "thanos"}, "targets": [{"refId": "A", "expr": "sum(up{cluster=\"calcifer-cloud\", namespace=\"monitoring\"})"}], "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []}, "options": {"reduceOptions": {"calcs": ["lastNotNull"]}}},
        {"id": 5, "type": "stat", "title": "Scrape targets", "gridPos": {"h": 5, "w": 6, "x": 18, "y": 8}, "datasource": {"type": "prometheus", "uid": "thanos"}, "targets": [{"refId": "A", "expr": "count(up{cluster=\"calcifer-cloud\"})"}], "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "options": {"reduceOptions": {"calcs": ["lastNotNull"]}}},
        {"id": 6, "type": "logs", "title": "Workload logs", "gridPos": {"h": 10, "w": 24, "x": 0, "y": 13}, "datasource": {"type": "loki", "uid": "loki"}, "targets": [{"refId": "A", "expr": "{cluster=\"calcifer-cloud\", namespace=~\"$namespace\"}"}], "options": {"showTime": true, "showLabels": true, "showCommonLabels": false, "wrapLines": true, "prettifyLogMessage": false, "enableLogDetails": true}}
      ],
      "links": [{"title": "Explore workload logs", "type": "link", "url": "/explore?orgId=1"}],
      "annotations": {"list": []}
    }
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: observability
  namespace: monitoring
spec:
  resyncPeriod: 5m
  folderRef: observability
  instanceSelector:
    matchLabels:
      dashboards: grafana
  configMapRef:
    name: observability-dashboard
    key: json
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-operational-dashboard
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: grafana-operator
data:
  json: |
    {
      "uid": "loki-operational-v3-7-7",
      "title": "Loki Operational (v3.7.7)",
      "tags": ["loki", "version-matched", "calcifer-cloud"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {"id": 1, "type": "timeseries", "title": "Loki target health", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}, "datasource": {"type": "prometheus", "uid": "thanos"}, "targets": [{"refId": "A", "expr": "sum(up{cluster=\"calcifer-cloud\", namespace=\"monitoring\", job=~\".*loki.*\"})"}], "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}},
        {"id": 2, "type": "timeseries", "title": "Loki memory", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}, "datasource": {"type": "prometheus", "uid": "thanos"}, "targets": [{"refId": "A", "expr": "sum(process_resident_memory_bytes{cluster=\"calcifer-cloud\", namespace=\"monitoring\", job=~\".*loki.*\"})"}], "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}},
        {"id": 3, "type": "logs", "title": "Loki workload query", "gridPos": {"h": 10, "w": 24, "x": 0, "y": 8}, "datasource": {"type": "loki", "uid": "loki"}, "targets": [{"refId": "A", "expr": "{cluster=\"calcifer-cloud\"}"}], "options": {"showTime": true, "showLabels": true, "wrapLines": true}}
      ],
      "annotations": {"list": []}
    }
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: loki-operational
  namespace: monitoring
spec:
  resyncPeriod: 5m
  folderRef: observability
  instanceSelector:
    matchLabels:
      dashboards: grafana
  configMapRef:
    name: loki-operational-dashboard
    key: json
---
