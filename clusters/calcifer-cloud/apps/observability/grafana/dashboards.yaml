apiVersion: v1
kind: ConfigMap
metadata:
  name: kubernetes-dashboard
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: grafana-operator
data:
  json: |
    {
      "uid": "kubernetes-overview",
      "title": "Kubernetes Overview",
      "tags": ["kubernetes", "calcifer-cloud", "observability"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {"id": 1, "type": "stat", "title": "Pods", "gridPos": {"h": 5, "w": 6, "x": 0, "y": 0}, "datasource": {"type": "prometheus", "uid": "thanos"}, "targets": [{"refId": "A", "expr": "sum(kube_pod_status_phase{cluster=\"calcifer-cloud\", phase=\"Running\"})"}], "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}}, "overrides": []}, "options": {"reduceOptions": {"calcs": ["lastNotNull"]}}},
        {"id": 2, "type": "stat", "title": "Pod restarts (1h)", "gridPos": {"h": 5, "w": 6, "x": 6, "y": 0}, "datasource": {"type": "prometheus", "uid": "thanos"}, "targets": [{"refId": "A", "expr": "sum(increase(kube_pod_container_status_restarts_total{cluster=\"calcifer-cloud\"}[1h]))"}], "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}, {"color": "red", "value": 10}]}}, "overrides": []}, "options": {"reduceOptions": {"calcs": ["lastNotNull"]}}},
        {"id": 3, "type": "timeseries", "title": "Node CPU utilization", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}, "datasource": {"type": "prometheus", "uid": "thanos"}, "targets": [{"refId": "A", "expr": "100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{cluster=\"calcifer-cloud\", mode=\"idle\"}[5m])))", "legendFormat": "{{instance}}"}], "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}, "overrides": []}, "options": {"legend": {"displayMode": "list"}, "tooltip": {"mode": "multi"}}},
        {"id": 4, "type": "timeseries", "title": "Node memory utilization", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 5}, "datasource": {"type": "prometheus", "uid": "thanos"}, "targets": [{"refId": "A", "expr": "100 * (1 - (node_memory_MemAvailable_bytes{cluster=\"calcifer-cloud\"} / node_memory_MemTotal_bytes{cluster=\"calcifer-cloud\"}))", "legendFormat": "{{instance}}"}], "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}, "overrides": []}, "options": {"legend": {"displayMode": "list"}, "tooltip": {"mode": "multi"}}},
        {"id": 5, "type": "timeseries", "title": "Pods by phase", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}, "datasource": {"type": "prometheus", "uid": "thanos"}, "targets": [{"refId": "A", "expr": "sum by (phase) (kube_pod_status_phase{cluster=\"calcifer-cloud\"})", "legendFormat": "{{phase}}"}], "fieldConfig": {"defaults": {"unit": "short", "min": 0}, "overrides": []}, "options": {"legend": {"displayMode": "list"}, "tooltip": {"mode": "multi"}}},
        {"id": 6, "type": "timeseries", "title": "Container CPU by namespace", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 13}, "datasource": {"type": "prometheus", "uid": "thanos"}, "targets": [{"refId": "A", "expr": "sum by (namespace) (rate(container_cpu_usage_seconds_total{cluster=\"calcifer-cloud\", container!=\"\"}[5m]))", "legendFormat": "{{namespace}}"}], "fieldConfig": {"defaults": {"unit": "cores", "min": 0}, "overrides": []}, "options": {"legend": {"displayMode": "list"}, "tooltip": {"mode": "multi"}}},
        {"id": 7, "type": "timeseries", "title": "Container memory by namespace", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16}, "datasource": {"type": "prometheus", "uid": "thanos"}, "targets": [{"refId": "A", "expr": "sum by (namespace) (container_memory_working_set_bytes{cluster=\"calcifer-cloud\", container!=\"\"})", "legendFormat": "{{namespace}}"}], "fieldConfig": {"defaults": {"unit": "bytes", "min": 0}, "overrides": []}, "options": {"legend": {"displayMode": "list"}, "tooltip": {"mode": "multi"}}},
        {"id": 8, "type": "timeseries", "title": "Kubernetes scrape targets", "gridPos": {"h": 8, "w": 24, "x": 0, "y": 24}, "datasource": {"type": "prometheus", "uid": "thanos"}, "targets": [{"refId": "A", "expr": "sum by (job) (up{cluster=\"calcifer-cloud\"})", "legendFormat": "{{job}}"}], "fieldConfig": {"defaults": {"unit": "short", "min": 0}, "overrides": []}, "options": {"legend": {"displayMode": "list"}, "tooltip": {"mode": "multi"}}}
      ],
      "annotations": {"list": []}
    }
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: kubernetes-overview
  namespace: monitoring
spec:
  resyncPeriod: 5m
  folderRef: observability
  instanceSelector:
    matchLabels:
      dashboards: grafana
  configMapRef:
    name: kubernetes-dashboard
    key: json
