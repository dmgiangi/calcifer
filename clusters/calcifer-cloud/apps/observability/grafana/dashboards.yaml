apiVersion: v1
kind: ConfigMap
metadata:
  name: authorization-server-dashboard
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: grafana-operator
data:
  json: |
    {"uid":"authorization-server","title":"Authorization Server","tags":["authorization","identity"],"timezone":"browser","schemaVersion":39,"version":4,"time":{"from":"now-6h","to":"now"},"templating":{"list":[{"name":"cluster","label":"Cluster","type":"query","datasource":{"type":"prometheus","uid":"victoriametrics"},"query":"label_values(up{namespace=\"authorization\"}, cluster)","includeAll":true,"multi":true,"current":{"text":"All","value":["$__all"]}}]},"panels":[{"id":1,"type":"stat","title":"Authorization servers up","gridPos":{"h":6,"w":6,"x":0,"y":0},"datasource":{"type":"prometheus","uid":"victoriametrics"},"targets":[{"refId":"A","expr":"sum(up{cluster=~\"$cluster\",namespace=\"authorization\"})"}]},{"id":2,"type":"timeseries","title":"HTTP requests","gridPos":{"h":8,"w":18,"x":6,"y":0},"datasource":{"type":"prometheus","uid":"victoriametrics"},"targets":[{"refId":"A","expr":"sum(rate(http_server_requests_seconds_count{cluster=~\"$cluster\",namespace=\"authorization\"}[5m])) by (cluster,status)"}]},{"id":3,"type":"timeseries","title":"Resident memory","gridPos":{"h":8,"w":12,"x":0,"y":8},"datasource":{"type":"prometheus","uid":"victoriametrics"},"targets":[{"refId":"A","expr":"process_resident_memory_bytes{cluster=~\"$cluster\",namespace=\"authorization\"}"}]}]}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: authorization-server
  namespace: monitoring
spec:
  resyncPeriod: 5m
  folderRef: observability
  instanceSelector:
    matchLabels:
      dashboards: grafana
  configMapRef:
    name: authorization-server-dashboard
    key: json
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: k8s-views-global
  namespace: monitoring
spec:
  resyncPeriod: 5m
  folderRef: observability
  instanceSelector:
    matchLabels:
      dashboards: grafana
  grafanaCom:
    id: 15757
  datasources:
    - inputName: "DS_PROMETHEUS"
      datasourceName: "VictoriaMetrics"
