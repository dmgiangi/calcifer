apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: monitoring
  labels:
    dashboards: grafana
spec:
  version: 13.2.1
  client:
    useKubeAuth: true
  disableDefaultAdminSecret: true
  config:
    log:
      mode: console
    metrics:
      enabled: "true"
    plugins:
      allow_loading_unsigned_plugins: victoriametrics-logs-datasource
      preinstall_auto_update: "false"
    server:
      root_url: https://grafana.calcifer.tech
    auth.basic:
      enabled: "false"
    auth.jwt:
      enabled: "true"
      header_name: Authorization
      expect_claims: '{"aud": ["operator.grafana.com"]}'
      username_claim: sub
      email_claim: sub
      auto_sign_up: "true"
      allow_assign_grafana_admin: "true"
      role_attribute_strict: "true"
      role_attribute_path: "contains(sub, 'system:serviceaccount:monitoring:grafana-operator') && 'GrafanaAdmin' || 'None'"
      jwk_set_url: https://kubernetes.default.svc.cluster.local:443/openid/v1/jwks
      jwk_set_bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      tls_client_ca: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    auth:
      disable_login_form: "true"
      # This single-tenant Grafana adopts the existing account while the IdP
      # migrates from Google's subject to the canonical subject user:admin.
      oauth_allow_insecure_email_lookup: "true"
    auth.generic_oauth:
      enabled: "true"
      name: Calcifer Authorization Server
      allow_sign_up: "true"
      client_id: grafana
      client_secret: $__env{GRAFANA_OIDC_CLIENT_SECRET}
      scopes: openid profile email
      login_attribute_path: sub
      email_attribute_path: email
      name_attribute_path: email
      # Use the canonical split-horizon endpoint; connected state is shared in
      # Cloud Redis and the same callback is valid from either network.
      auth_url: https://auth.calcifer.tech/oauth2/authorize
      token_url: https://auth.calcifer.tech/oauth2/token
      api_url: https://auth.calcifer.tech/userinfo
      use_pkce: "true"
      role_attribute_path: contains(roles[*], 'admin') && 'Admin' || 'Viewer'
    auth.proxy:
      enabled: "true"
      header_name: X-WEBAUTH-USER
      header_property: username
      auto_sign_up: "true"
      whitelist: 10.42.0.0/16
      headers: Role:X-WEBAUTH-ROLE
  deployment:
    spec:
      replicas: 1
      strategy:
        type: Recreate
      template:
        spec:
          containers:
            - name: grafana
              env:
                - name: GF_SECURITY_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin-credentials
                      key: GF_SECURITY_ADMIN_USER
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin-credentials
                      key: GF_SECURITY_ADMIN_PASSWORD
                - name: GRAFANA_OIDC_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: grafana-authorization-server-oauth
                      key: GRAFANA_OIDC_CLIENT_SECRET
              resources:
                requests:
                  cpu: 75m
                  memory: 256Mi
                limits:
                  cpu: 400m
                  memory: 768Mi
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc
  persistentVolumeClaim:
    spec:
      storageClassName: local-path
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
  service:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "3000"
    spec:
      type: ClusterIP
  ingress:
    metadata:
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production-azure
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
    spec:
      ingressClassName: traefik
      rules:
        - host: grafana.calcifer.tech
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: grafana-service
                    port:
                      number: 3000
      tls:
        - hosts:
            - grafana.calcifer.tech
          secretName: grafana-tls
