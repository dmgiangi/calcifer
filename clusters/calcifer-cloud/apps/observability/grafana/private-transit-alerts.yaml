apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: private-transit
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderRef: observability
  interval: 1m
  rules:
    - uid: cloud-home-private-transit-down
      title: Cloud to Home HTTPS path unavailable
      condition: B
      for: 5m
      noDataState: Alerting
      execErrState: Alerting
      labels:
        severity: critical
        component: private-transit
      annotations:
        summary: Cloud cannot reach the Home HTTPS edge through WireGuard
        description: Check WireGuard handshake freshness, Home recovery cooldown, routing and TLS. This probe also fails if Home Traefik or Home Assistant is unavailable; it does not uniquely diagnose WireGuard.
        runbook: docs/home-edge-operations.md#wireguard-health-and-bounded-recovery
      data:
        - refId: A
          datasourceUid: victoriametrics
          relativeTimeRange: {from: 300, to: 0}
          model:
            datasource: {type: prometheus, uid: victoriametrics}
            editorMode: code
            instant: true
            range: false
            # Ignore samples older than three scrapes; collector loss is not success.
            expr: min(probe_success{cluster="calcifer-cloud",job="cloud-home-edge-https",probe_name="cloud-home-edge-https"} and (time() - timestamp(probe_success{cluster="calcifer-cloud",job="cloud-home-edge-https",probe_name="cloud-home-edge-https"}) < 90)) or vector(0)
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
        - refId: B
          datasourceUid: __expr__
          relativeTimeRange: {from: 0, to: 0}
          model:
            datasource: {type: __expr__, uid: __expr__}
            refId: B
            type: threshold
            expression: A
            conditions:
              - evaluator: {type: lt, params: [1]}
                operator: {type: and}
                reducer: {type: last, params: []}
                type: query