apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victoriametrics
  namespace: monitoring
spec:
  uid: victoriametrics
  resyncPeriod: 5m
  plugins:
    - name: prometheus
      version: 13.1.7
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasource:
    name: VictoriaMetrics
    type: prometheus
    access: proxy
    url: http://victoria-metrics.monitoring.svc.cluster.local:8428
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      queryTimeout: 60s
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victoria-logs
  namespace: monitoring
spec:
  uid: victoria-logs
  resyncPeriod: 1m
  plugins:
    - name: victoriametrics-logs-datasource
      version: 0.31.0
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasource:
    name: VictoriaLogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victoria-logs.monitoring.svc.cluster.local:9428
    editable: false
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victoria-traces
  namespace: monitoring
spec:
  uid: victoria-traces
  resyncPeriod: 1m
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasource:
    name: VictoriaTraces
    type: jaeger
    access: proxy
    url: http://victoria-traces.monitoring.svc.cluster.local:10428/select/jaeger
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: victoria-logs
        filterByTraceID: true
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
