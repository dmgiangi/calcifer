apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepositories.yaml
  - helmreleases.yaml
  - grafana-admin.sops.yaml
  - velero-credentials.sops.yaml
  - metrics-home-ingest-certificate.yaml
  - logs-home-ingest-certificate.yaml
  - traces-home-ingest-certificate.yaml
  - metrics-home-ingest-auth.sops.yaml
  - logs-home-ingest-auth.sops.yaml
  - traces-home-ingest-auth.sops.yaml
  - home-ingest-traefik.yaml
  - home-ingest-nodeport.yaml
  - victoria-traces-ingress-network-policy.yaml
  - victoria-metrics-ingress-network-policy.yaml
  - victoria-logs-ingress-network-policy.yaml
  - public-otlp-auth.sops.yaml
  - otlp-vmauth.yaml
  - otlp-gateway.yaml
  - otlp-gateway-network-policy.yaml
# public-otlp-ingress.yaml is staged separately: do NOT enable before approvals.
configMapGenerator:
  - name: alloy-otlp-gateway
    namespace: monitoring
    files:
      - config.alloy=otlp-gateway.alloy
