apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 30m
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    cleanupOnFail: true
    recreate: true
  chart:
    spec:
      chart: loki
      version: 18.13.0
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: monitoring
  values:
    deploymentMode: Monolithic
    gateway:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
    minio:
      enabled: false
    rollout_operator:
      enabled: false
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    ruler:
      enabled: false
    read:
      enabled: false
      replicas: 0
    write:
      enabled: false
      replicas: 0
    backend:
      enabled: false
      replicas: 0
    defaults:
      extraArgs:
        - -config.expand-env=true
      extraEnvFrom:
        - secretRef:
            name: loki-objstore
    loki:
      structuredConfig:
        auth_enabled: false
        server:
          http_listen_port: 3100
          grpc_listen_port: 9095
          log_level: info
        common:
          path_prefix: /var/loki
          compactor_grpc_address: loki.monitoring.svc.cluster.local:9095
          replication_factor: 1
          storage:
            azure:
              account_name: calciferobs
              container_name: loki
              use_service_principal: true
              tenant_id: ${AZURE_TENANT_ID}
              client_id: ${AZURE_CLIENT_ID}
              client_secret: ${AZURE_CLIENT_SECRET}
        schema_config:
          configs:
            - from: "2024-04-01"
              store: tsdb
              object_store: azure
              schema: v13
              index:
                prefix: loki_index_
                period: 24h
        limits_config:
          retention_period: 720h
          reject_old_samples: true
          reject_old_samples_max_age: 168h
          max_cache_freshness_per_query: 10m
          split_queries_by_interval: 15m
        runtime_config:
          file: /etc/loki/runtime-config/runtime-config.yaml
        compactor:
          working_directory: /var/loki/compactor
          retention_enabled: true
          delete_request_store: azure
          retention_delete_delay: 2h
          retention_delete_worker_count: 1
        storage_config:
          azure:
            account_name: calciferobs
            container_name: loki
            use_service_principal: true
            tenant_id: ${AZURE_TENANT_ID}
            client_id: ${AZURE_CLIENT_ID}
            client_secret: ${AZURE_CLIENT_SECRET}
            request_timeout: 0
          tsdb_shipper:
            active_index_directory: /var/loki/tsdb-shipper-active
            cache_location: /var/loki/tsdb-shipper-cache
          use_thanos_objstore: false
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      server:
        log_level: info
        http_listen_port: 3100
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: azure
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      storage:
        type: azure
        bucketNames:
          chunks: loki
          ruler: loki
        azure:
          accountName: calciferobs
      limits_config:
        retention_period: 720h
        reject_old_samples: true
        reject_old_samples_max_age: 168h
        max_cache_freshness_per_query: 10m
        split_queries_by_interval: 15m
      compactor:
        working_directory: /var/loki/compactor
        retention_enabled: true
        delete_request_store: azure
        retention_delete_delay: 2h
        retention_delete_worker_count: 1
      storage_config:
        tsdb_shipper:
          active_index_directory: /var/loki/tsdb-shipper-active
          cache_location: /var/loki/tsdb-shipper-cache
      service:
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/path: /metrics
          prometheus.io/port: "3100"
      extraArgs:
        - -config.expand-env=true
    singleBinary:
      enabled: true
      replicas: 1
      persistence:
        enabled: true
        storageClass: local-path
        size: 8Gi
      service:
        type: ClusterIP
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/path: /metrics
          prometheus.io/port: "3100"
      resources:
        requests:
          cpu: 75m
          memory: 256Mi
        limits:
          cpu: 400m
          memory: 768Mi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: monitoring
spec:
  interval: 30m
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: tempo
      version: 3.0.0
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: monitoring
