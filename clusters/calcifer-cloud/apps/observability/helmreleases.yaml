apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-operator
  namespace: monitoring
spec:
  interval: 30m
  timeout: 10m
  install:
    createNamespace: false
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    cleanupOnFail: true
    recreate: true
  chart:
    spec:
      chart: grafana-operator
      version: 5.25.0
      sourceRef:
        kind: HelmRepository
        name: grafana-operator
        namespace: monitoring
  values:
    namespaceScope: false
    replicas: 1
    leaderElect: true
    enforceCacheLabels: safe
    resources:
      requests:
        cpu: 25m
        memory: 96Mi
      limits:
        cpu: 200m
        memory: 256Mi
    serviceMonitor:
      enabled: false
    metricsService:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9090"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: thanos
  namespace: monitoring
spec:
  interval: 30m
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    force: true
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    cleanupOnFail: true
    recreate: true
  chart:
    spec:
      chart: thanos
      version: 0.43.0
      sourceRef:
        kind: HelmRepository
        name: thanos-community
        namespace: monitoring
  values:
    fullnameOverride: thanos-v2
    global:
      objstore:
        createSecret: false
        secretName: thanos-objstore
        secretKey: objstore.yml
      resources:
        requests:
          cpu: 25m
          memory: 96Mi
        limits:
          cpu: 200m
          memory: 256Mi
      storageClass: local-path
      thanosRules:
        enabled: false
    bucket:
      enabled: false
    query:
      enabled: true
      replicaCount: 1
      endpoints:
        autogen:
          enabled: true
      service:
        type: ClusterIP
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/path: /metrics
          prometheus.io/port: "9090"
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 384Mi
    receive:
      enabled: true
      mode: standalone
      replicaCount: 1
      tsdb:
        retention: 48h
      extraArgs:
        - --tsdb.out-of-order.time-window=2h
      persistence:
        enabled: true
        size: 8Gi
        storageClass: local-path
      service:
        type: ClusterIP
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/path: /metrics
          prometheus.io/port: "10902"
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 300m
          memory: 1Gi
    storegateway:
      enabled: true
      replicaCount: 1
      service:
        type: ClusterIP
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/path: /metrics
          prometheus.io/port: "10902"
      persistence:
        enabled: true
        storageClass: local-path
        size: 4Gi
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 384Mi
    compactor:
      enabled: true
      retention:
        resolutionRaw: 30d
        resolution5m: 30d
        resolution1h: 365d
      extraArgs:
        - --log.level=info
        - --log.format=logfmt
        - --consistency-delay=30m
      service:
        type: ClusterIP
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/path: /metrics
          prometheus.io/port: "10902"
      persistence:
        enabled: true
        storageClass: local-path
        size: 4Gi
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 384Mi
    queryFrontend:
      enabled: false
    ruler:
      enabled: false
    rustfs:
      enabled: false
    kube-prometheus-stack:
      enabled: false
---
