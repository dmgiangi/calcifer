apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-operator
  namespace: monitoring
spec:
  interval: 30m
  timeout: 10m
  install:
    createNamespace: false
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    cleanupOnFail: true
    recreate: true
  chart:
    spec:
      chart: grafana-operator
      version: 5.25.0
      sourceRef:
        kind: HelmRepository
        name: grafana-operator
        namespace: monitoring
  values:
    namespaceScope: false
    replicas: 1
    leaderElect: true
    enforceCacheLabels: safe
    resources:
      requests:
        cpu: 25m
        memory: 96Mi
      limits:
        cpu: 200m
        memory: 256Mi
    serviceMonitor:
      enabled: false
    metricsService:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9090"
---
