  name: victoria-traces
  namespace: monitoring
spec:
  interval: 30m
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: victoria-traces-single
      version: 0.1.11
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: monitoring
  values:
    server:
      fullnameOverride: victoria-traces
      replicaCount: 1
      retentionPeriod: 7d
      retentionDiskSpaceUsage: 8
      podAnnotations:
        backup.velero.io/backup-volumes: server-volume
      podLabels:
        observability.calcifer.tech/trace-backend: victoria-traces
      persistentVolume:
        enabled: true
        storageClassName: local-path
        size: 10Gi
      service:
        clusterIP: ""
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/path: /metrics
          prometheus.io/port: "10428"
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 300m
          memory: 384Mi
