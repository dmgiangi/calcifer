      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "3200"
    persistence:
      enabled: true
      storageClassName: local-path
      accessModes:
        - ReadWriteOnce
      size: 10Gi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  interval: 30m
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: alloy
      version: 1.12.1
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
  values:
    crds:
      create: true
    controller:
      type: daemonset
      replicas: 1
      podDisruptionBudget:
        enabled: false
    service:
      type: ClusterIP
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "12345"
    alloy:
      enableReporting: false
      storagePath: /tmp/alloy
      extraPorts:
        - name: otlp-http
          port: 4318
          targetPort: 4318
          protocol: TCP
      configMap:
        content: |-
          logging {
            level  = "info"
            format = "logfmt"
          }

          otelcol.receiver.otlp "authorization_server" {
            http {
              endpoint = "0.0.0.0:4318"
            }
            output {
              traces = [otelcol.processor.batch.authorization_server.input]
            }
          }

          otelcol.processor.batch "authorization_server" {
            timeout         = "1s"
            send_batch_size = 128
            output {
              traces = [otelcol.exporter.otlphttp.tempo.input]
            }
          }

          otelcol.exporter.otlphttp "tempo" {
            client {
              endpoint = "http://tempo.monitoring.svc.cluster.local:4318"
              tls {
                insecure = true
              }
            }
          }

          discovery.kubernetes "pods" {
            role = "pod"
          }

          discovery.relabel "pod_metrics" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
              regex         = "true"
              action         = "keep"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
              target_label  = "__metrics_path__"
              regex         = "(.+)"
              action         = "replace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_port", "__meta_kubernetes_pod_ip"]
              regex         = "([0-9]+);(.+)"
              replacement   = "$2:$1"
              target_label  = "__address__"
              action         = "replace"
            }
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
              action         = "replace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
              action         = "replace"
            }
          }

          prometheus.scrape "pod_metrics" {
            targets    = discovery.relabel.pod_metrics.output
            forward_to = [prometheus.remote_write.thanos.receiver]
          }

          discovery.kubernetes "services" {
            role = "service"
          }

          discovery.relabel "service_metrics" {
            targets = discovery.kubernetes.services.targets

            rule {
              source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_scrape"]
              regex         = "true"
              action         = "keep"
            }
            rule {
              source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_path"]
              target_label  = "__metrics_path__"
              regex         = "(.+)"
              action         = "replace"
            }
            rule {
              source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_port"]
              target_label  = "__meta_kubernetes_service_port_number"
              regex         = "(.+)"
              action         = "replace"
            }
            rule {
              source_labels = ["__meta_kubernetes_service_name", "__meta_kubernetes_namespace", "__meta_kubernetes_service_port_number"]
              regex         = "(.+);(.+);(.+)"
              replacement   = "$1.$2.svc.cluster.local:$3"
              target_label  = "__address__"
              action         = "replace"
            }
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
              action         = "replace"
            }
            rule {
              source_labels = ["__meta_kubernetes_service_name"]
              target_label  = "service"
              action         = "replace"
            }
          }

          prometheus.scrape "service_metrics" {
            targets    = discovery.relabel.service_metrics.output
            forward_to = [prometheus.remote_write.thanos.receiver]
          }

          discovery.kubernetes "nodes" {
            role = "node"
          }

          discovery.relabel "kubelet" {
            targets = discovery.kubernetes.nodes.targets

            rule {
              source_labels = ["__meta_kubernetes_node_name"]
              target_label  = "node"
              action         = "replace"
            }
            rule {
              target_label = "__address__"
              replacement  = "kubernetes.default.svc.cluster.local:443"
              action        = "replace"
            }
            rule {
              source_labels = ["__meta_kubernetes_node_name"]
              regex         = "(.+)"
              replacement   = "/api/v1/nodes/$1/proxy/metrics"
              target_label  = "__metrics_path__"
              action         = "replace"
            }
          }

          prometheus.scrape "kubelet" {
            targets           = discovery.relabel.kubelet.output
            scheme             = "https"
            bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
            tls_config {
              insecure_skip_verify = true
            }
            forward_to = [prometheus.remote_write.thanos.receiver]
          }

          discovery.relabel "cadvisor" {
            targets = discovery.kubernetes.nodes.targets

            rule {
              source_labels = ["__meta_kubernetes_node_name"]
              target_label  = "node"
              action         = "replace"
            }
            rule {
              target_label = "__address__"
              replacement  = "kubernetes.default.svc.cluster.local:443"
              action        = "replace"
            }
            rule {
              source_labels = ["__meta_kubernetes_node_name"]
              regex         = "(.+)"
              replacement   = "/api/v1/nodes/$1/proxy/metrics/cadvisor"
              target_label  = "__metrics_path__"
              action        = "replace"
            }
          }

          prometheus.scrape "cadvisor" {
            targets           = discovery.relabel.cadvisor.output
            scheme             = "https"
            bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
            tls_config {
              insecure_skip_verify = true
            }
            forward_to = [prometheus.remote_write.thanos.receiver]
          }

          loki.process "pod_logs" {
            stage.labels {
              values = {
                cluster   = "cluster",
                namespace = "namespace",
                pod       = "pod",
                container = "container",
              }
            }
            forward_to = [loki.write.loki.receiver]
          }

          discovery.relabel "pod_logs" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
              action        = "replace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
              action        = "replace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
              action        = "replace"
            }
          }

          loki.source.kubernetes "pod_logs" {
            targets    = discovery.relabel.pod_logs.output
            forward_to = [loki.process.pod_logs.receiver]
          }

          prometheus.remote_write "thanos" {
            external_labels = {
              cluster = "calcifer-cloud",
            }
            endpoint {
              url = "http://thanos-v2-receive.monitoring.svc.cluster.local:10908/api/v1/receive"
            }
          }

          loki.write "loki" {
            external_labels = {
              cluster = "calcifer-cloud",
            }
            endpoint {
              url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
            }
          }
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 384Mi
    rbac:
      create: true
      clusterRules:
        - apiGroups:
            - ""
          resources:
            - nodes/proxy
          verbs:
            - get
