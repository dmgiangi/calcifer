apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: home-ingest-wireguard-source
  namespace: monitoring
spec:
  ipAllowList:
    sourceRange:
      - 172.31.255.2/32
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: home-thanos-ingest-auth
  namespace: monitoring
spec:
  basicAuth:
    secret: thanos-home-ingest-auth
    removeHeader: true
    headerField: X-Home-Thanos-Ingest
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: home-loki-ingest-auth
  namespace: monitoring
spec:
  basicAuth:
    secret: loki-home-ingest-auth
    removeHeader: true
    headerField: X-Home-Loki-Ingest
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: home-tempo-ingest-auth
  namespace: monitoring
spec:
  basicAuth:
    secret: tempo-home-ingest-auth
    removeHeader: true
    headerField: X-Home-Tempo-Ingest
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: home-victoria-metrics-path
  namespace: monitoring
spec:
  replacePathRegex:
    regex: ^/api/v1/receive$
    replacement: /api/v1/write
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: home-victoria-logs-path
  namespace: monitoring
spec:
  replacePathRegex:
    regex: ^/loki/api/v1/push$
    replacement: /insert/loki/api/v1/push
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: home-victoria-traces-path
  namespace: monitoring
spec:
  replacePathRegex:
    regex: ^/v1/traces$
    replacement: /insert/opentelemetry/v1/traces
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: home-thanos-ingest
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`thanos-ingest.calcifer.tech`) && (Path(`/api/v1/receive`) || Path(`/api/v1/write`))
      kind: Rule
      middlewares:
        - name: home-ingest-wireguard-source
        - name: home-thanos-ingest-auth
        - name: home-victoria-metrics-path
      services:
        - name: victoria-metrics
          port: 8428
  tls:
    secretName: thanos-home-ingest-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: home-loki-ingest
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`loki-ingest.calcifer.tech`) && (Path(`/loki/api/v1/push`) || Path(`/insert/loki/api/v1/push`))
      kind: Rule
      middlewares:
        - name: home-ingest-wireguard-source
        - name: home-loki-ingest-auth
        - name: home-victoria-logs-path
      services:
        - name: victoria-logs
          port: 9428
  tls:
    secretName: loki-home-ingest-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: home-tempo-ingest
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`tempo-ingest.calcifer.tech`) && Path(`/v1/traces`)
      kind: Rule
      middlewares:
        - name: home-ingest-wireguard-source
        - name: home-tempo-ingest-auth
        - name: home-victoria-traces-path
      services:
        - name: victoria-traces
          port: 10428
  tls:
    secretName: tempo-home-ingest-tls
