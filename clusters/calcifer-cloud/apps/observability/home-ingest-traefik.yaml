apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: home-ingest-wireguard-source
  namespace: monitoring
spec:
  ipAllowList:
    sourceRange:
      - 172.31.255.2/32
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: home-metrics-ingest-auth
  namespace: monitoring
spec:
  basicAuth:
    secret: metrics-home-ingest-auth
    removeHeader: true
    headerField: X-Home-Metrics-Ingest
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: home-logs-ingest-auth
  namespace: monitoring
spec:
  basicAuth:
    secret: logs-home-ingest-auth
    removeHeader: true
    headerField: X-Home-Logs-Ingest
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: home-traces-ingest-auth
  namespace: monitoring
spec:
  basicAuth:
    secret: traces-home-ingest-auth
    removeHeader: true
    headerField: X-Home-Traces-Ingest
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: home-victoria-metrics-path
  namespace: monitoring
spec:
  replacePathRegex:
    regex: ^/api/v1/receive$
    replacement: /api/v1/write
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: home-victoria-logs-path
  namespace: monitoring
spec:
  replacePathRegex:
    regex: ^/loki/api/v1/push$
    replacement: /insert/loki/api/v1/push
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: home-victoria-traces-path
  namespace: monitoring
spec:
  replacePathRegex:
    regex: ^/v1/traces$
    replacement: /insert/opentelemetry/v1/traces
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: home-metrics-ingest
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`metrics-ingest.calcifer.tech`) && (Path(`/api/v1/receive`) || Path(`/api/v1/write`))
      kind: Rule
      middlewares:
        - name: home-ingest-wireguard-source
        - name: home-metrics-ingest-auth
        - name: home-victoria-metrics-path
      services:
        - name: victoria-metrics
          port: 8428
  tls:
    secretName: metrics-home-ingest-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: home-logs-ingest
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`logs-ingest.calcifer.tech`) && (Path(`/loki/api/v1/push`) || Path(`/insert/loki/api/v1/push`))
      kind: Rule
      middlewares:
        - name: home-ingest-wireguard-source
        - name: home-logs-ingest-auth
        - name: home-victoria-logs-path
      services:
        - name: victoria-logs
          port: 9428
  tls:
    secretName: logs-home-ingest-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: home-traces-ingest
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`traces-ingest.calcifer.tech`) && (Path(`/v1/traces`) || Path(`/insert/opentelemetry/v1/traces`))
      kind: Rule
      middlewares:
        - name: home-ingest-wireguard-source
        - name: home-traces-ingest-auth
        - name: home-victoria-traces-path
      services:
        - name: victoria-traces
          port: 10428
  tls:
    secretName: traces-home-ingest-tls
