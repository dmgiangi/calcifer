identity:
  clients:
    home-assistant:
      id: home-assistant
      secret: ${HOME_ASSISTANT_OIDC_CLIENT_SECRET}
      redirect-uris:
        - https://home.calcifer.tech/auth/oidc/callback
      scopes:
        - openid
        - profile
        - email
      grant-types:
        - authorization_code
      authentication-methods:
        - client_secret_post
      audience: home-assistant
      require-proof-key: true
    homepage:
      id: homepage
      secret: ${HOMEPAGE_OIDC_CLIENT_SECRET}
      redirect-uris:
        - https://calcifer.tech/api/auth/callback/homepage-oidc
      scopes:
        - openid
        - profile
        - email
      grant-types:
        - authorization_code
      authentication-methods:
        - client_secret_basic
        - client_secret_post
      audience: homepage
      require-proof-key: true
    zigbee2mqtt:
      id: zigbee2mqtt
      secret: ${ZIGBEE2MQTT_OIDC_CLIENT_SECRET}
      redirect-uris:
        - https://zigbee.calcifer.tech/oauth2/callback
      scopes:
        - openid
        - profile
        - email
      grant-types:
        - authorization_code
      authentication-methods:
        - client_secret_basic
      audience: zigbee2mqtt
      require-proof-key: true
