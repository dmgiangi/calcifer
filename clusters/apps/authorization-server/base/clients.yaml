identity:
  clients:
    homepage:
      id: homepage
      secret: ${HOMEPAGE_OIDC_CLIENT_SECRET}
      redirect-uris:
        - https://calcifer.tech/api/auth/callback/homepage-oidc
      scopes:
        - openid
        - profile
        - email
      grant-types:
        - authorization_code
      authentication-methods:
        - client_secret_basic
        - client_secret_post
      audience: homepage
      require-proof-key: true
