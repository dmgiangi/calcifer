# Copy to authorization-server-secrets.sops.yaml, replace every placeholder
# locally, encrypt with SOPS, then replace this example in kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: authorization-server-secrets-example
  namespace: authorization
type: Opaque
stringData:
  GOOGLE_CLIENT_ID: REPLACE_LOCALLY
  GOOGLE_CLIENT_SECRET: REPLACE_LOCALLY
  GRAFANA_OIDC_CLIENT_SECRET: REPLACE_LOCALLY
  GRAFANA_API_CLIENT_SECRET: REPLACE_LOCALLY
  HOMEPAGE_OIDC_CLIENT_SECRET: REPLACE_LOCALLY
  HOME_ASSISTANT_OIDC_CLIENT_SECRET: REPLACE_LOCALLY
  ZIGBEE2MQTT_OIDC_CLIENT_SECRET: REPLACE_LOCALLY
  AUTH_LOCAL_LOGIN_PASSWORD_HASH: REPLACE_WITH_ARGON2ID_OR_BCRYPT_HASH
  jwt-private-key.pem: REPLACE_LOCALLY
