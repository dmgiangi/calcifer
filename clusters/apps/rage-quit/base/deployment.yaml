apiVersion: apps/v1
kind: Deployment
metadata:
  name: rage-quit
  namespace: web
  labels:
    app.kubernetes.io/name: rage-quit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rage-quit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rage-quit
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rage-quit
          image: ghcr.io/dmgiangi/calcifer-rage-quit:operator-must-release
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: rage-quit-config
          env:
            - name: RAGE_QUIT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rage-quit-secrets
                  key: RAGE_QUIT_CLIENT_SECRET
                  optional: false
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 128Mi
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rage-quit-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
