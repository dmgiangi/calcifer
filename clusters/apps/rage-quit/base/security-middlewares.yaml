apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rage-quit-security-headers
  namespace: web
spec:
  headers:
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: no-referrer
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    customResponseHeaders:
      Cache-Control: no-store
