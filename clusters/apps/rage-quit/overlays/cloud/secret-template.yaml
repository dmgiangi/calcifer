# Documentation fixture ONLY; deliberately not included in kustomization.yaml.
# The application rejects this explicit placeholder if the fixture is applied.
# Never replace it with a plaintext credential in Git. Generate and SOPS-encrypt
# a separate secrets.sops.yaml using the operator's protected input file.
apiVersion: v1
kind: Secret
metadata:
  name: rage-quit-secrets
  namespace: web
type: Opaque
stringData:
  RAGE_QUIT_CLIENT_SECRET: REPLACE_WITH_SECRET
