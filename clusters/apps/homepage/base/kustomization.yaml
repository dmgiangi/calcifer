apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: homepage-config
    namespace: homepage
    files:
      - services.yaml
      - settings.yaml
      - bookmarks.yaml
      - widgets.yaml
      - docker.yaml
      - kubernetes.yaml
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - middleware.yaml
