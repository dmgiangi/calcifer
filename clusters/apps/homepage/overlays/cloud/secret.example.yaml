# Copy to homepage-secrets.sops.yaml, replace every placeholder locally, and encrypt with SOPS.
apiVersion: v1
kind: Secret
metadata:
  name: homepage-secrets-example
  namespace: homepage
type: Opaque
stringData:
  HOMEPAGE_AUTH_SECRET: REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS
  HOMEPAGE_OIDC_CLIENT_SECRET: MUST_MATCH_AUTHORIZATION_SERVER
