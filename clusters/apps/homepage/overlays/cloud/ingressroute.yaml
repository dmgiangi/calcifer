apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homepage
  namespace: homepage
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`calcifer.tech`)
      kind: Rule
      middlewares:
        - name: homepage-security-headers
      services:
        - name: homepage
          port: 3000
  tls:
    secretName: homepage-tls
